services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${CONTAINER_PREFIX:-semantic_search}_qdrant
    restart: unless-stopped
    networks:
      - local
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-semantic_search}_app
    image: ${CONTAINER_PREFIX:-semantic_search}_app_image:latest
    entrypoint: /scripts/entrypoint.sh
    networks:
      - local
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8000"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - qwen_model_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5m



volumes:
  qdrant_data: { }
  qwen_model_cache: { }


networks:
  local:
    name: semantic_search
    external: false
